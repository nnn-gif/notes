<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="dark">
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="clock-wrap">
      <div class="clock" id="clock">--:--</div>
      <div class="date-line">
        <span id="date"></span>
        <span class="dot-sep">·</span>
        <span id="greeting"></span>
      </div>
    </div>
    <div class="top-actions">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" type="text" placeholder="Search notes  (/)" autocomplete="off" spellcheck="false" />
      </div>
      <button id="btn-theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <button id="btn-export" class="icon-btn" title="Export notes as JSON" aria-label="Export notes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button id="btn-import" class="icon-btn" title="Import notes from JSON" aria-label="Import notes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </button>
      <input type="file" id="file-import" accept="application/json,.json" hidden />
    </div>
  </header>

  <main class="content">
    <div class="quick-capture">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <select id="quick-type" class="quick-type" title="Note type" aria-label="Note type">
        <option value="note">Note</option>
        <option value="list">List</option>
        <option value="daily">Daily todo</option>
      </select>
      <input id="quick" type="text" placeholder="Capture a thought… press Enter to save" autocomplete="off" />
    </div>

    <div class="list-head">
      <span id="stats" class="stats"></span>
      <div class="new-group">
        <button id="btn-new" class="btn-new" title="New note">+ Note</button>
        <button id="btn-new-list" class="btn-new ghost" title="New list">+ List</button>
        <button id="btn-new-daily" class="btn-new ghost" title="New daily todo">+ Daily <kbd>N</kbd></button>
        <button id="btn-widgets" class="btn-new ghost" title="Widgets">▦ Widgets</button>
      </div>
    </div>

    <!-- Widgets board -->
    <div id="widget-board" class="widget-board"></div>

    <!-- widget template kept in JS; today section below is v1.1 legacy, hidden when widgets active -->
    <section class="today" id="today-section" hidden>
      <div class="today-head">
        <span class="today-label">Today</span>
        <span class="today-date" id="today-date"></span>
        <span class="today-progress" id="today-progress"></span>
      </div>
      <div id="today-cards" class="today-cards"></div>
    </section>

    <!-- Calendar of daily todos -->
    <section class="calendar" id="calendar">
      <div class="cal-head">
        <span class="cal-title" id="cal-title"></span>
        <span class="cal-nav">
          <button id="cal-prev" class="cal-arrow" title="Previous month" aria-label="Previous month">‹</button>
          <button id="cal-today-btn" class="cal-jump" title="Jump to today">Today</button>
          <button id="cal-next" class="cal-arrow" title="Next month" aria-label="Next month">›</button>
        </span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="day-panel" id="day-panel"></div>
    </section>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"></path>
      </svg>
      <p class="empty-title" id="empty-title">No notes yet</p>
      <p class="empty-sub" id="empty-sub"></p>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <!-- Editor modal -->
  <div id="editor-backdrop" class="editor-backdrop" hidden>
    <div class="editor" role="dialog" aria-modal="true" aria-label="Edit note">
      <div class="ed-head">
        <span id="ed-type" class="ed-type" title="Note type">note</span>
        <input id="ed-title" class="ed-title" placeholder="Title" maxlength="160" autocomplete="off" />
        <div class="ed-head-actions">
          <button id="ed-pin" class="pin-btn" title="Pin note" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"></path></svg>
          </button>
          <button id="ed-delete" class="icon-btn danger" title="Delete note" aria-label="Delete note">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </div>

      <div class="ed-bodywrap">
        <textarea id="ed-body" class="ed-body" placeholder="Start writing…"></textarea>
        <div id="ed-items" class="ed-items" hidden></div>
        <div id="ed-add-row" class="ed-add-row" hidden>
          <span class="add-glyph" aria-hidden="true">+</span>
          <input id="ed-new-item" type="text" placeholder="Add item… press Enter" autocomplete="off" />
        </div>
      </div>

      <div class="ed-foot">
        <div class="color-dots" id="color-dots" title="Accent color"></div>
        <input type="date" id="ed-date" class="ed-date" hidden aria-label="Daily todo date" />
        <span id="ed-count" class="ed-count"></span>
        <button id="ed-done" class="btn-done">Done</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
