<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>chat harness (extension context)</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-theme="dark">
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="topbar">
    <div class="clock-wrap">
      <div class="clock" id="clock">--:--</div>
      <div class="date-line">
        <span id="date"></span>
        <span class="dot-sep">·</span>
        <span id="greeting"></span>
      </div>
    </div>
    <div class="top-actions">
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
      </div>
      <button id="btn-theme" class="icon-btn" aria-label="theme">T</button>
      <button id="btn-export" class="icon-btn" aria-label="export">E</button>
      <button id="btn-import" class="icon-btn" aria-label="import">I</button>
      <input type="file" id="file-import" hidden />
    </div>
  </header>
  <main class="content">
    <div class="quick-capture">
      <select id="quick-type" class="quick-type"><option value="note">Note</option></select>
      <input id="quick" type="text" />
    </div>
    <div class="list-head">
      <span id="stats" class="stats"></span>
      <div class="new-group">
        <button id="btn-new" class="btn-new">+ Note</button>
        <button id="btn-new-list" class="btn-new ghost">+ List</button>
        <button id="btn-new-daily" class="btn-new ghost">+ Daily</button>
        <button id="btn-widgets" class="btn-new ghost">Widgets</button>
      </div>
    </div>
    <div id="widget-board" class="widget-board"></div>
    <section class="today" id="today-section" hidden>
      <div class="today-head">
        <span class="today-label">Today</span>
        <span class="today-date" id="today-date"></span>
        <span class="today-progress" id="today-progress"></span>
      </div>
      <div id="today-cards" class="today-cards"></div>
    </section>
    <section class="calendar" id="calendar">
      <div class="cal-head">
        <span class="cal-title" id="cal-title"></span>
        <span class="cal-nav">
          <button id="cal-prev" class="cal-arrow">‹</button>
          <button id="cal-today-btn" class="cal-jump">Today</button>
          <button id="cal-next" class="cal-arrow">›</button>
        </span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="day-panel" id="day-panel"></div>
    </section>
    <div id="empty" class="empty" hidden>
      <p class="empty-title" id="empty-title"></p>
      <p class="empty-sub" id="empty-sub"></p>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <div id="editor-backdrop" class="editor-backdrop" hidden>
    <div class="editor" role="dialog">
      <div class="ed-head">
        <span id="ed-type" class="ed-type">✎</span>
        <input id="ed-title" class="ed-title" />
        <div class="ed-head-actions">
          <button id="ed-pin" class="pin-btn">📌</button>
          <button id="ed-delete" class="icon-btn danger">×</button>
        </div>
      </div>
      <div class="ed-bodywrap">
        <textarea id="ed-body" class="ed-body"></textarea>
        <div id="ed-items" class="ed-items" hidden></div>
        <div id="ed-add-row" class="ed-add-row" hidden>
          <span class="add-glyph">+</span>
          <input id="ed-new-item" type="text" />
        </div>
      </div>
      <div class="ed-foot">
        <div class="color-dots" id="color-dots"></div>
        <input type="date" id="ed-date" class="ed-date" hidden />
        <span id="ed-count" class="ed-count"></span>
        <button id="ed-done" class="btn-done">Done</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/js/app.js"></script>
  <script>
    // Runs after app.js in the real extension context (chrome.storage + host_permissions).
    window.__errors = [];
    window.addEventListener("error", (e) => {
      window.__errors.push(e.message + " @" + e.lineno);
      console.error("PAGEERROR: " + e.message + " @" + e.lineno + ":" + e.colno);
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.error("UNHANDLED: " + (e.reason && e.reason.stack || e.reason));
    });

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    (async () => {
      await sleep(1200);
      // add the chat widget through the real Widgets menu
      document.getElementById("btn-widgets").click();
      await sleep(200);
      const menu = [...document.querySelectorAll(".widgets-menu .wm-row")]
        .find((r) => r.dataset.wtype === "chat");
      console.log("HARNESS menuRow=" + Boolean(menu));
      if (menu) menu.click();
      await sleep(600);
      const host = document.querySelector('.w-host[data-wtype="chat"]');
      console.log("HARNESS host=" + (host ? "found" : "MISSING"));
      if (!host) { console.log("HARNESS errors=" + JSON.stringify(window.__errors)); return; }

      // clean slate: no chatcfg -> setup card expected first
      const status = host.querySelector('[data-role="chat-status"]');
      console.log("HARNESS mode=" + (status ? "setup" : "connected"));
      if (status) {
        // click LM Studio provider, set URL, connect
        const lms = host.querySelector('[data-prov="lmstudio"]');
        lms.click();
        await sleep(100);
        const url = host.querySelector("#chat-url");
        url.value = "http://192.168.29.20:1234";
        host.querySelector('[data-wact2="chat-connect"]').click();
        // wait for models
        for (let i = 0; i < 40 && !document.querySelector(".chat-model-select"); i++) await sleep(250);
        console.log("HARNESS connected=" + Boolean(document.querySelector(".chat-model-select"))
          + " status=" + JSON.stringify((document.querySelector('[data-role="chat-status"]') || {}).textContent || ""));
      }

      // connected flow: send a message to the real server
      const ta = document.querySelector('[data-role="chat-input"]');
      if (ta) {
        ta.value = "Reply with exactly: extension context test ok";
        ta.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        console.log("HARNESS send dispatched");
        await sleep(10000);
        const msgs = document.querySelectorAll(".chat-msg");
        const last = msgs[msgs.length - 1];
        console.log("HARNESS msgs=" + msgs.length + " reply=" + JSON.stringify(last ? last.textContent.slice(0, 100) : "none"));
        console.log("HARNESS errors=" + JSON.stringify(window.__errors));
      }
    })();
  </script>
</body>
</html>
